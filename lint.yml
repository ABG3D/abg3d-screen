name: lint

on:
  push:
  pull_request:

jobs:
  lowercase-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on uppercase paths
        run: |
          bad="$(git ls-files | grep -E '[A-Z]' | grep -v -x -E '(README\.md|LICENSE)' || true)"
          if [ -n "$bad" ]; then
            echo "Uppercase paths found:"
            echo "$bad"
            exit 1
          fi

  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir pyflakes
      - run: python -m pyflakes abg3d_screen tools
      - run: bash -n install.sh uninstall.sh run-dev.sh
