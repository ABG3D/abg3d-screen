# abg3d-screen configuration (copied to ~/printer_data/config/abg3d-screen.conf by install.sh)
[main]
host = 127.0.0.1
port = 7125
# Only needed if Moonraker does not trust localhost
api_key =
fullscreen = true
# Window size used when fullscreen = false (desktop testing)
width = 800
height = 480
# Panel diagonal in inches (4.3 / 5 / 7). 0 = auto-detect from the display's reported size
diagonal = 0
# Base font size in px. 0 = scale automatically from resolution and DPI
font_size = 0
log_level = INFO
